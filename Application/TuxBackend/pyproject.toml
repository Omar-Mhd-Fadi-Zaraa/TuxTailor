[project]
dependencies = [
  "fastapi>=0.138.0",
  "uvicorn[standard]>=0.49.0",
  "scalar-fastapi>=1.8.2",
  "httpx>=0.28.0",
  "python-jose[cryptography]>=3.5.0",
  "pwdlib[argon2]>=0.3.0",
  "python-dotenv>=1.2.0",
  "langchain>=1.3.0",
  "langchain-core>=1.4.0",
  "langchain-ollama>=1.1.0",
  "ddgs>=9.14.0",
  "click>=8.1.0",
]

name = "tuxbackend"
version = "0.1.0"
requires-python = ">=3.11"
description = "A set of agent tools for chatting about and creating Linux based custom configs"

[project.optional-dependencies]
dev = ["ruff", "black", "mypy", "bandit"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "routes",
  "controllers",
  "db",
  "models",
  "middlewares",
  "agents",
  "config",
]

[project.scripts]
tuxtailor = "cli.main:cli"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/"]

[tool.bandit]
exclude_dirs = [".venv", "__pycahce__", "build", "dist"]

[tool.pytest.ini_options]
addopts = "-rA -s -v"
