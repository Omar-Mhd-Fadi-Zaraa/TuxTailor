name: CI/CD for TuxTailor

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Display Python version and location
        run: |
          python --version
          which python
      - name: Install dependencies
        working-directory: Application/TuxBackend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Linting and format checks
        working-directory: Application/TuxBackend
        run: |
          ruff check .
          black --check .
      - name: Static type checks
        working-directory: Application/TuxBackend
        run: |
          mypy .
      - name: Security checks
        working-directory: Application/TuxBackend
        run: |
          bandit -c Application/TuxBackend/pyproject.toml -r .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10,", "3.11", "3.12"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: Application/TuxBackend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Automated tests with Pytest
        working-directory: Application/TuxBackend
        run: |
          pytest
  release:
    runs-on: ubuntu-latest
    needs:
      - tests
      - lint-static-checks
    steps:
      - name: Release
        run: echo "Release"
