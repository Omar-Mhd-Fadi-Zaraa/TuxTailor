name: CI/CD for TuxTailor

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Display Python version and location
        run: |
          python --version
          which python
      - name: Install dependencies
        working-directory: Application/TuxBackend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Linting and format checks
        working-directory: Application/TuxBackend
        run: |
          ruff check .
          black --check .
      - name: Static type checks
        working-directory: Application/TuxBackend
        run: |
          mypy .
      - name: Security checks
        working-directory: Application/TuxBackend
        run: |
          bandit -c Application/TuxBackend/pyproject.toml -r .
